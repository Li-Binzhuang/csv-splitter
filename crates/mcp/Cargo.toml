[package]
name = "csvx-mcp"
version.workspace = true
edition.workspace = true
description = "MCP stdio server for csvx: tool schemas and execution."
repository.workspace = true
license.workspace = true

[dependencies]
csvx-core = { workspace = true }
rmcp = { version = "3.11", features = ["transport-io"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "io-util", "io-std"] }
