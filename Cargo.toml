[workspace]
members = ["crates/core", "crates/cli"]
resolver = "2"

[workspace.package]
version = "2.8.0"
edition = "2021"

[workspace.dependencies]
csv-splitter-core = { path = "crates/core" }
zstd = "0.13"
tar = "0.4"
memchr = "2"
zip = "2"
flate2 = "1"
bzip2 = "0.5"
xz2 = "0.1"
sevenz-rust = "0.6"
rand = "0.8"

[profile.release]
opt-level = 3
lto = true

# Debug info is most of the size of target/: a full rebuild with it produced
# ~70 GB of artifacts for this workspace (DuckDB is bundled). Tests and
# benchmarks do not need DWARF, so drop it.
[profile.dev]
debug = 0

[profile.test]
debug = 0
