name: Windows check

# The one Windows channel, on the target the release actually ships.
#
# It used to be mingw-w64 on ubuntu, because that is cheap to install. That toolchain is
# GCC 10 with the win32 thread model, whose libstdc++ has no std::mutex/std::shared_mutex
# — and DuckDB's headers use both, so the job died inside libduckdb-sys with
# "'mutex' in namespace 'std' does not name a type". A cross-check that cannot compile the
# engine is not a cross-check; MSVC on windows-latest is.
#
# Costs about ten minutes of DuckDB compilation, hence the path filter: a documentation or
# script commit does not pay for it, a change to Rust code does.

on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/windows.yml"
  pull_request:
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-cargo-rolling-${{ github.run_id }}
          restore-keys: windows-cargo-rolling-

      - name: Check the CLI
        run: |
          cargo check -p csv-splitter-cli 2>&1 | Tee-Object -FilePath windows.log

      - name: Report failure as annotations
        if: failure()
        shell: pwsh
        run: |
          Get-Content windows.log -ErrorAction SilentlyContinue |
            Select-String -Pattern "error", "panicked" |
            Select-Object -First 8 |
            ForEach-Object { Write-Host "::error title=Windows check::$($_.Line)" }
          Write-Host "--- last lines ---"
          Get-Content windows.log -Tail 25 -ErrorAction SilentlyContinue

      - name: Upload log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-check-log
          path: windows.log
          retention-days: 7
