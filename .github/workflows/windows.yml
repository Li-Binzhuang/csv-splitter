name: Windows cross-check

# Cross-compiling the CLI for Windows on a Linux runner, so a break in the cfg(unix)
# gating is caught on push instead of at tag time.
#
# Why a separate workflow: this costs about five minutes of DuckDB C++ compilation for
# the Windows target, which is not worth paying on a documentation or script commit. The
# path filter runs it exactly when Rust code, the manifest or the lockfile changed.
#
# `cargo check`, not a full build: the question is whether the code compiles for Windows,
# and the link step is what the release matrix's MSVC build answers anyway.

on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/windows.yml"
  pull_request:
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-cross-rolling-${{ github.run_id }}
          restore-keys: windows-cross-rolling-

      - name: Install mingw-w64
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64

      - name: Check the CLI for Windows
        env:
          CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: x86_64-w64-mingw32-gcc
          CC_x86_64_pc_windows_gnu: x86_64-w64-mingw32-gcc
          CXX_x86_64_pc_windows_gnu: x86_64-w64-mingw32-g++
          AR_x86_64_pc_windows_gnu: x86_64-w64-mingw32-ar
        run: cargo check -p csv-splitter-cli --target x86_64-pc-windows-gnu
