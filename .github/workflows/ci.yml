name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  # Incremental artefacts are large and useless in CI.
  CARGO_INCREMENTAL: "0"
  # DuckDB is compiled from C++ source; keeping debug info for it multiplies
  # artefact size and link time without helping any test here.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

# One job, deliberately.
#
# It used to be two (`engine`, then `cli` via `needs`). That relied on the runner
# creating both jobs; once the repository's cache quota was exceeded, runs came
# back as "failure" with one job skipped and, sometimes, no jobs at all — a red X
# with nothing to read. A single job cannot lose half of itself.
#
# The cost is that DuckDB compiles even when only the engine changed. With the
# rolling cache below that is a few minutes, and it buys a signal that is always
# complete.
jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Rolling key: at most one entry survives per prefix. A per-lockfile key
      # accumulated two 4 GB target archives and pushed the repo past its 10 GB
      # cache limit.
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: linux-cargo-rolling-${{ github.run_id }}
          restore-keys: linux-cargo-rolling-

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxdo-dev fonts-noto-cjk

      - name: Format
        run: cargo fmt --all -- --check

      - name: Test engine (no DuckDB)
        run: cargo test -p csv-splitter-core -p csv-splitter-gui

      - name: Performance guard
        run: cargo test -p csv-splitter-core --test performance

      - name: Clippy workspace
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test CLI (includes the HTTP API)
        run: cargo test -p csv-splitter-cli
