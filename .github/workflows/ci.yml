name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  # Incremental artefacts are large and useless in CI.
  CARGO_INCREMENTAL: "0"
  # DuckDB is compiled from C++ source; keeping debug info for it multiplies
  # artefact size and link time without helping any test here.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

# One job, deliberately.
#
# It used to be two (`engine`, then `cli` via `needs`). That relied on the runner
# creating both jobs; once the repository's cache quota was exceeded, runs came
# back as "failure" with one job skipped and, sometimes, no jobs at all — a red X
# with nothing to read. A single job cannot lose half of itself.
jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Rolling key: at most one entry survives per prefix. A per-lockfile key
      # accumulated two 4 GB target archives and pushed the repo past its 10 GB
      # cache limit.
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: linux-cargo-rolling-${{ github.run_id }}
          restore-keys: linux-cargo-rolling-

      # No GTK/xdo/font packages: they were for the removed GUI crate, cost a minute
      # per run, and nothing in the CLI or the API needs them.

      - name: Format
        run: cargo fmt --all -- --check

      # Each test step tees its output to a log. The reporting step below turns the
      # failing test names into annotations, because a run's logs need a signed-in
      # admin to read while annotations are public — this project's failures used to
      # be a red X with no text.
      - name: Test engine (no DuckDB)
        run: |
          set -o pipefail
          cargo test -p csv-splitter-core -p csv-splitter-cli 2>&1 | tee engine.log

      - name: Performance guard
        run: |
          set -o pipefail
          cargo test -p csv-splitter-core --test performance 2>&1 | tee perf.log

      - name: Clippy workspace
        run: |
          set -o pipefail
          cargo clippy --workspace --all-targets -- -D warnings 2>&1 | tee clippy.log

      - name: Test CLI (includes the HTTP API)
        run: |
          set -o pipefail
          cargo test -p csv-splitter-cli 2>&1 | tee cli.log

      - name: Report failures as annotations
        if: failure()
        run: |
          set +e
          # Failing test names and the first assertion line of each.
          grep -hE "^(test .* \.\.\. FAILED|test .* FAILED|---- .* stdout ----|panicked at|assertion .* failed)" ./*.log 2>/dev/null \
            | head -10 \
            | while IFS= read -r line; do echo "::error title=CI failure::$line"; done
          echo "--- tail of every log ---"
          for f in ./*.log; do
            [ -f "$f" ] || continue
            echo "== $f =="
            tail -n 15 "$f"
          done

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: "*.log"
          retention-days: 7
