name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0). Leave empty to build without releasing."
        required: false
        type: string

env:
  CARGO_TERM_COLOR: always
  APP_NAME: csv-splitter

permissions:
  contents: write

jobs:
  # Determine the version tag for this run
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      do_release: ${{ steps.version.outputs.do_release }}
    steps:
      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
            echo "do_release=true" >> "$GITHUB_OUTPUT"
          elif [[ -n "${{ inputs.tag }}" ]]; then
            echo "version=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
            echo "do_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev" >> "$GITHUB_OUTPUT"
            echo "do_release=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: csv-splitter-linux-x86_64
            ext: .tar.gz
          - os: macos-14
            target: aarch64-apple-darwin
            artifact: csv-splitter-macos-arm64
            ext: .tar.gz
          - os: macos-14
            target: x86_64-apple-darwin
            artifact: csv-splitter-macos-x86_64
            ext: .tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: csv-splitter-windows-x86_64
            ext: .zip

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # Rolling key: one entry survives per target. A per-lockfile key accumulated
          # multi-gigabyte archives and pushed the repository past its cache quota.
          key: ${{ matrix.target }}-release-rolling-${{ github.run_id }}
          restore-keys: ${{ matrix.target }}-release-rolling-

      # No GTK/xdo/font packages: they belonged to the removed GUI crate. The CLI and
      # the HTTP backend are pure Rust plus a bundled DuckDB, and DuckDB ships its own
      # C++ sources, so a plain runner is enough.

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }} -p csv-splitter-cli

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p staging
          cp target/${{ matrix.target }}/release/csv-splitter staging/
          cd staging
          chmod +x csv-splitter
          tar czf ../${{ matrix.artifact }}${{ matrix.ext }} csv-splitter

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path staging
          Copy-Item "target/${{ matrix.target }}/release/csv-splitter.exe" "staging/"
          Compress-Archive -Path "staging/csv-splitter.exe" -DestinationPath "${{ matrix.artifact }}${{ matrix.ext }}"

      - name: Generate SHA256 checksum (Unix)
        if: runner.os != 'Windows'
        run: shasum -a 256 ${{ matrix.artifact }}${{ matrix.ext }} > ${{ matrix.artifact }}${{ matrix.ext }}.sha256

      - name: Generate SHA256 checksum (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $hash = (Get-FileHash "${{ matrix.artifact }}${{ matrix.ext }}" -Algorithm SHA256).Hash.ToLower()
          "$hash  ${{ matrix.artifact }}${{ matrix.ext }}" | Out-File -Encoding ascii "${{ matrix.artifact }}${{ matrix.ext }}.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}${{ matrix.ext }}
            ${{ matrix.artifact }}${{ matrix.ext }}.sha256

  release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    if: needs.prepare.outputs.do_release == 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List release assets
        run: ls -lhR artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.version }}
          name: CSV Splitter ${{ needs.prepare.outputs.version }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(needs.prepare.outputs.version, '-') }}
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/*.sha256
